# Al Thuraya Holding - Group Treasury service.
# Server-specific values (database password, data folders) are overridden on the server by
# C:\ThurayaData\treasury\config\application.properties (spring.config.additional-location in Tomcat).
spring.application.name=treasury-service
treasury.version=@project.version@

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ThurayaTreasury;encrypt=true;trustServerCertificate=true
spring.datasource.username=thuraya_treasury
spring.datasource.password=ChangeMe-LocalDev-2019
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2012Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

treasury.bank-file-dir=${java.io.tmpdir}/thuraya-treasury/bank-files
treasury.report-dir=${java.io.tmpdir}/thuraya-treasury/reports
treasury.report-cron=0 30 7 * * SUN-THU
logging.file.name=${java.io.tmpdir}/thuraya-treasury/logs/treasury-service.log
